services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retfenymozi
      POSTGRES_PASSWORD: retfenymozi
      POSTGRES_DB: retfenymozi
    ports:
      - '5432:5432'
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
      - retfenymozi-db-data:/var/lib/postgresql/data

volumes:
  retfenymozi-db-data:
