name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Staging deployment URL to promote to production'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - run: npm run db:migrate -- "${{ secrets.PRODUCTION_DATABASE_URL }}"
      # Seats and ticket types are reference data the booking flow cannot work
      # without. Idempotent (onConflictDoNothing), so it is safe on every promote.
      - run: npm run seed:seats
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - run: npm install -g vercel@latest
      - run: vercel promote "${{ inputs.deployment_url }}" --token="${{ secrets.VERCEL_TOKEN }}" --yes
