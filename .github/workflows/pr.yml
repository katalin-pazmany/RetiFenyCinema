name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retfenymozi
          POSTGRES_PASSWORD: retfenymozi
          POSTGRES_DB: retfenymozi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://retfenymozi:retfenymozi@localhost:5432/retfenymozi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate -- "$TEST_DATABASE_URL"
      - run: npm run test:integration

  # Static validation only — `terraform plan` would need real Vercel/Neon
  # credentials, which CI does not have. `init -backend=false` + `validate`
  # need none.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform fmt -check
      - run: terraform validate

  preview-e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g vercel@latest neonctl@latest

      # `pull_request` also fires on `synchronize` (every push to an open PR),
      # so this step must tolerate the branch already existing from an earlier
      # run — Neon rejects creating a branch whose name is already taken.
      - name: Create ephemeral Neon branch for this PR (if it does not exist)
        run: |
          BRANCH="pr-${{ github.event.number }}"
          if neonctl branches get "$BRANCH" \
            --project-id "${{ secrets.NEON_PROJECT_ID }}" \
            --api-key "${{ secrets.NEON_API_KEY }}" >/dev/null 2>&1; then
            echo "Neon branch $BRANCH already exists — reusing it"
          else
            neonctl branches create \
              --project-id "${{ secrets.NEON_PROJECT_ID }}" \
              --api-key "${{ secrets.NEON_API_KEY }}" \
              --name "$BRANCH"
          fi

      - name: Read the branch connection string
        id: neon
        run: |
          URL=$(neonctl connection-string "pr-${{ github.event.number }}" \
            --project-id "${{ secrets.NEON_PROJECT_ID }}" \
            --api-key "${{ secrets.NEON_API_KEY }}")
          echo "database_url=$URL" >> "$GITHUB_OUTPUT"

      - run: npm run db:migrate -- "${{ steps.neon.outputs.database_url }}"
      - run: npm run seed:fixture
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}

      - run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URL="${{ steps.neon.outputs.database_url }}" \
            -e TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            -e OMDB_API_KEY="${{ secrets.OMDB_API_KEY }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
